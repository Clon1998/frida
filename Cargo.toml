# Cargo workspace for Frida.
#
# Think of this like a Maven parent POM: it lists the member crates (modules) and centrally
# defines dependency versions (`[workspace.dependencies]`, like `<dependencyManagement>`).
# Member crates then write `foo = { workspace = true }` instead of repeating the version.
[workspace]
resolver = "3"
members = [
    "crates/frida-core",
    "crates/frida-script",
    "crates/frida-secrets",
    "crates/frida-git",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Clon1998/frida"

[workspace.dependencies]
# Internal crates
frida-core = { path = "crates/frida-core" }
frida-script = { path = "crates/frida-script" }
frida-secrets = { path = "crates/frida-secrets" }
frida-git = { path = "crates/frida-git" }

# Shared third-party crates
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
directories = "6.0.0"
serde-saphyr = "2.0.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tempfile = "3.27.0"
insta = "1.49.0"

# Rust <-> TypeScript type generation. The Tauri 2 compatible line of tauri-specta is still a
# release candidate, and it requires an *exact* specta version, so both are pinned with `=`.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
