# Cargo workspace for Frida.
#
# Think of this like a Maven parent POM: it lists the member crates (modules) and centrally
# defines dependency versions (`[workspace.dependencies]`, like `<dependencyManagement>`).
# Member crates then write `foo = { workspace = true }` instead of repeating the version.
[workspace]
resolver = "3"
members = [
    "crates/frida-core",
    "crates/frida-script",
    "crates/frida-secrets",
    "crates/frida-git",
    "crates/frida-testserver",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Clon1998/frida"

[workspace.dependencies]
# Internal crates
frida-core = { path = "crates/frida-core" }
frida-script = { path = "crates/frida-script" }
frida-secrets = { path = "crates/frida-secrets" }
frida-git = { path = "crates/frida-git" }
frida-testserver = { path = "crates/frida-testserver" }

# Shared third-party crates
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
directories = "6.0.0"
serde-saphyr = "2.0.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tempfile = "3.27.0"
insta = "1.49.0"
reqwest = { version = "0.13.5", features = ["cookies", "form", "multipart", "gzip", "brotli", "deflate", "zstd"] }
tokio-util = "0.7.20"
base64 = "0.23.1"
axum = "0.8.9"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = "0.26.6"
time = "0.3.55"
notify-debouncer-full = "0.7.0"
keyring = "4.2.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
reqwest_cookie_store = "0.10.0"
# Scripting (frida-script): QuickJS with async support, and the hash helpers of `crypto`.
rquickjs = { version = "0.14.0", features = ["futures"] }
sha1 = "0.11.0"
md-5 = "0.11.0"
hmac = "0.13.0"

# Response decompression (see frida-core http/decode.rs). Already in the tree through reqwest.
flate2 = "1.1.10"
brotli = "9.0.0"
zstd = "0.14.2"
cookie_store = "0.22.1"
shell-words = "1.1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Rust <-> TypeScript type generation. The Tauri 2 compatible line of tauri-specta is still a
# release candidate, and it requires an *exact* specta version, so both are pinned with `=`.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
