name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a collection with …
        2. Send …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Frida version
      description: Settings → Updates shows it. For frida-run, `frida-run --version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >-
        Logs are in the app data folder under `logs/` (see the FAQ for where that is). They never contain secret
        values, but please check them for anything else you'd rather not share. Never paste tokens or passwords.
