name: Release

# Pushing a tag like `v0.2.0` builds the installers for every platform and attaches them to a
# draft GitHub Release. Review the draft (notes are generated from the commits), then publish it.
# The tag must match the version in app/src-tauri/tauri.conf.json and Cargo.toml.
#
# macOS signing and notarization use these repository secrets (PLAN.md M13): APPLE_CERTIFICATE
# (Developer ID .p12, base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# KEYCHAIN_PASSWORD (any random string), APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (the
# .p8 file's content) and FRIDA_RELEASE_PROFILE ("Frida Release" provisioning profile, base64).
#
# In-app updates (PLAN.md M14) need TAURI_SIGNING_PRIVATE_KEY (the content of the key from
# `pnpm tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the matching public key
# is `plugins.updater.pubkey` in tauri.conf.json. With them, every installer gets a `.sig` and
# the release gets a `latest.json`, which installed apps read once the release is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    name: Create draft release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(jq -r .version app/src-tauri/tauri.conf.json)
          crates=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$app" ] || [ "$tag" != "$crates" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json ($app) / Cargo.toml ($crates)"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Frida $GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            # Oldest supported Ubuntu, so the AppImage/.deb run on as many distros as possible.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Only to decide whether to sign (step `if:` can't read `secrets` directly).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      # Just "true"/"false", so the key itself is only visible to the build step.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # macOS: signed with the Developer ID certificate, with the "Frida Release" provisioning
      # profile embedded (data protection keychain, PLAN.md M13), and notarized. Without the
      # secrets (e.g. in a fork) the build stays unsigned.
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          FRIDA_RELEASE_PROFILE: ${{ secrets.FRIDA_RELEASE_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p app/src-tauri/signing
          echo "$FRIDA_RELEASE_PROFILE" | base64 --decode > app/src-tauri/signing/embedded.provisionprofile
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "SIGNED_CONFIG=--config src-tauri/tauri.signed.conf.json" >> "$GITHUB_ENV"

      - name: Enable updater artifacts
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      - name: Build app bundles
        working-directory: app
        env:
          # Signs the updater artifacts (Tauri's own signature, not Apple's).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by the Tauri CLI (macOS only): it imports the certificate into a temporary
          # keychain, signs, and notarizes with the App Store Connect API key.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm tauri build --target ${{ matrix.target }} ${{ env.SIGNED_CONFIG }} ${{ env.UPDATER_CONFIG }}

      # Both macOS builds produce `Frida.app.tar.gz`; give each its architecture so they don't
      # overwrite each other in the release (update-manifest.sh expects these names).
      - name: Name the macOS update archive
        if: runner.os == 'macOS' && env.HAS_UPDATER_KEY == 'true'
        run: |
          cd "target/${{ matrix.target }}/release/bundle/macos"
          name="Frida_${GITHUB_REF_NAME#v}_${{ startsWith(matrix.target, 'aarch64') && 'aarch64' || 'x86_64' }}.app.tar.gz"
          mv Frida.app.tar.gz "$name"
          mv Frida.app.tar.gz.sig "$name.sig"

      # The command line runner (PLAN.md M15), as a plain archive per target. No version in
      # the name, so `releases/latest/download/frida-run-<target>.tar.gz` always works.
      - name: Build and attach frida-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release --locked -p frida-cli --target ${{ matrix.target }}
          cd "target/${{ matrix.target }}/release"
          name="frida-run-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" frida-run.exe
            file="$name.zip"
          else
            tar czf "$name.tar.gz" frida-run
            file="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attach the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "target/${{ matrix.target }}/release/bundle"
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find . -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \))
          echo "Uploading: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # latest.json for in-app updates, built from the uploaded signatures. Only after every build
  # succeeded, so the manifest never points at a missing installer.
  manifest:
    name: Update manifest
    needs: build
    runs-on: ubuntu-22.04
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_UPDATER_KEY == 'true'
      - name: Write and attach latest.json
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir "$RUNNER_TEMP/assets"
          gh release view "$GITHUB_REF_NAME" --json body -q .body > "$RUNNER_TEMP/notes.md"
          app/scripts/update-manifest.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/notes.md" > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
