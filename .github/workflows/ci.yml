name: CI

# Lint & test run on every push/PR (except docs-only changes). The slow 4-OS build matrix
# runs only on pull requests or when started by hand ("Run workflow" in the Actions tab), where
# you can tick which platforms to build and whether to run lint & test first.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      checks:
        description: Run lint & test before building
        type: boolean
        default: true
      macos-arm64:
        description: Build macOS (Apple Silicon)
        type: boolean
        default: true
      macos-x64:
        description: Build macOS (Intel)
        type: boolean
        default: true
      windows-x64:
        description: Build Windows
        type: boolean
        default: true
      linux-x64:
        description: Build Linux
        type: boolean
        default: true

# A new push cancels the previous push/PR run on the same ref. Manual runs get their own group
# (the run id), so a push to main never cancels a long manual build (Windows takes ~30 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: the test binaries (with the AWS SDK linked in) would
  # otherwise fill the runner's disk and crash the linker.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Lint & test
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # The runner image ships SDKs we don't use (~20 GB).
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Generated TS bindings are up to date
        run: git diff --exit-code -- app/ui/src/bindings.ts

      - name: UI typecheck
        working-directory: app/ui
        run: pnpm typecheck
      - name: UI lint
        working-directory: app/ui
        run: pnpm lint
      - name: UI test
        working-directory: app/ui
        run: pnpm test

  e2e:
    name: UI flows (Playwright)
    # The UI against an in-memory fake backend (app/ui/src/e2e); no Rust build needed.
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: app/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: UI flow tests
        working-directory: app/ui
        run: pnpm e2e
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: app/ui/test-results/
          retention-days: 7

  platforms:
    name: Pick platforms
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MACOS_ARM64: ${{ inputs.macos-arm64 }}
          MACOS_X64: ${{ inputs.macos-x64 }}
          WINDOWS_X64: ${{ inputs.windows-x64 }}
          LINUX_X64: ${{ inputs.linux-x64 }}
        # Pull requests build everything; manual runs build only the ticked platforms.
        run: |
          wanted() { [ "$MANUAL" != true ] || [ "$1" = true ]; }
          entries=()
          wanted "$MACOS_ARM64" && entries+=('{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}')
          wanted "$MACOS_X64" && entries+=('{"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin"}')
          wanted "$WINDOWS_X64" && entries+=('{"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"}')
          # Oldest supported Ubuntu, so the AppImage/.deb run on as many distros as possible.
          wanted "$LINUX_X64" && entries+=('{"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}')
          [ ${#entries[@]} -gt 0 ] || echo "::warning::No platform selected, nothing to build"
          include="[$(IFS=,; echo "${entries[*]}")]"
          echo "Building: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [check, platforms]
    # Run when lint & test passed, or was skipped on purpose in a manual run.
    if: >-
      !cancelled() && github.event_name != 'push'
      && needs.platforms.result == 'success' && needs.platforms.outputs.include != '[]'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build app bundles
        working-directory: app
        run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: frida-http-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
