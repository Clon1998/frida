[package]
name = "frida-cli"
description = "frida-run: runs Frida collections from the command line, e.g. in CI."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Not `frida`: that name belongs to the frida instrumentation toolkit (CLAUDE.md, Naming).
[[bin]]
name = "frida-run"
path = "src/main.rs"

[dependencies]
frida-core = { workspace = true }
frida-secrets = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
frida-testserver = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
