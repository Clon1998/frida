version: 1
name: Orders
seq: 2
headers:
- name: Authorization
  value: "Bearer {{token}}"
  enabled: true
scripts:
  pre: |
    // fri.sendRequest from a script, awaited.
    const ping = await fri.sendRequest({ url: fri.interpolate("{{baseUrl}}/ping?from=script") });
    fri.setVar("pinged", ping.data.query);
