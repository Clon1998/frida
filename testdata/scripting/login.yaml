version: 1
name: Login
seq: 1
method: POST
url: "{{baseUrl}}/login"
body:
  mode: json
  json: |
    {"user": "{{user}}", "token": "t-123"}
scripts:
  pre: |
    console.log("logging in as", fri.getEnvVar("user"));
  post: |
    // The echo server returns the sent body as a string.
    const sent = JSON.parse(res.body.body);
    fri.setVar("token", sent.token);
tests: |
  test("login ok", () => expect(res).to.have.status(200));
