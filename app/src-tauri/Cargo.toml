[package]
name = "frida-http"
description = "Frida desktop app: thin Tauri command layer over the frida-* crates."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# The Rust library holds all app code so it can be unit-tested; main.rs only calls `run()`.
[lib]
name = "frida_http_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
frida-core = { workspace = true }
frida-script = { workspace = true }
frida-secrets = { workspace = true }
frida-git = { workspace = true }
tokio = { workspace = true }
tauri = { version = "2.12.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
# In-app updates (PLAN.md M14), verified with Tauri's own update signature.
tauri-plugin-updater = "2.14.0"
# Formats the release date of an update (already in the tree through Tauri).
time = { version = "0.3.55", features = ["formatting"] }
# Only to choose the TLS backend once for the whole process (see `run` in lib.rs).
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
