[package]
name = "frida-http"
description = "Frida desktop app: thin Tauri command layer over the frida-* crates."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

# The Rust library holds all app code so it can be unit-tested; main.rs only calls `run()`.
[lib]
name = "frida_http_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
frida-core = { workspace = true }
tauri = { version = "2.12.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[lints]
workspace = true
